<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gallery - Wild West Wall Art</title>
  <link rel="stylesheet" href="styles.css" />
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-17501059263"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'AW-17501059263');
</script></head>
<body>
  <nav class="nav" aria-label="Primary">
    <div class="nav-inner">
      <a class="nav-brand" href="index.html">
        <img src="finlogo.png" alt="Wild West Wall Art logo" class="logo">
        <span>Wild West Wall Art</span>
      </a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle menu">☰</button>
      <ul id="nav-menu" class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="gallery.html" aria-current="page">Gallery</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main style="padding: 1.5rem 1rem;">
    <section id="gallery">
      <h2>Gallery</h2>
      <div class="gallery-shelves"></div>
    </section>
  </main>

  <script>
  // Mobile nav toggle
  (function(){
    const btn = document.querySelector('.nav-toggle');
    const menu = document.getElementById('nav-menu');
    if (btn && menu) {
      btn.addEventListener('click', () => {
        const open = menu.classList.toggle('open');
        btn.setAttribute('aria-expanded', String(open));
      });
    }
  })();

  // Build gallery dynamically from generated list, 3 items per shelf
  (function initGallery(){
    fetch('gallery-list.json')
      .then(response => response.json())
      .then(data => {
        const files = (data.images || []).slice();
        const shelvesRoot = document.querySelector('.gallery-shelves');
        if (!shelvesRoot) return;
        if (files.length === 0) {
          const msg = document.createElement('p');
          msg.textContent = 'No images available—add some to gallery_images/ and redeploy!';
          shelvesRoot.appendChild(msg);
          return;
        }

        function chunk(array, size){
          const chunks = [];
          for (let i=0; i<array.length; i+=size) chunks.push(array.slice(i, i+size));
          return chunks;
        }

        const groups = chunk(files, 3);
        groups.forEach((group, groupIndex) => {
          const shelfContainer = document.createElement('div');
          shelfContainer.className = 'shelf-container';
          const shelf = document.createElement('div');
          shelf.className = 'shelf';
          const items = document.createElement('div');
          items.className = 'items';
          shelfContainer.appendChild(shelf);
          shelfContainer.appendChild(items);
          shelvesRoot.appendChild(shelfContainer);

          group.forEach((file, idx) => {
            const src = `images/${file}`;
            const title = file.replace(/\.[^.]+$/, '').replace(/[-_]+/g,' ').replace(/\b\w/g, m => m.toUpperCase());
            const item = document.createElement('div');
            item.className = 'shelf-item';
            const tilt = (groupIndex * 3 + idx) % 2 === 0 ? -5 : 5;
            item.style.transform = `rotateY(${tilt}deg) translateZ(20px)`;
            item.innerHTML = `<img src="${src}" alt="${title}" class="canvas-img" loading="lazy" decoding="async">`;
            item.addEventListener('click', () => {
              const name = file.replace(/\.[^.]+$/, '');
              window.location.href = `photos/${encodeURIComponent(name)}.html`;
            });
            item.addEventListener('mouseover', () => item.style.transform += ' scale(1.05) translateY(-10px)');
            item.addEventListener('mouseout', () => item.style.transform = `rotateY(${tilt}deg) translateZ(20px)`);
            items.appendChild(item);
          });
        });
      })
      .catch(err => {
        console.error('Error loading gallery list:', err);
        const shelvesRoot = document.querySelector('.gallery-shelves');
        if (shelvesRoot) {
          const msg = document.createElement('p');
          msg.textContent = 'Error loading gallery—please check console.';
          shelvesRoot.appendChild(msg);
        }
      });
  })();
  </script>
</body>
</html>
