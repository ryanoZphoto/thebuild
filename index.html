<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wild West Wall Art</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Wild West Wall Art</h1>
  </header>
  <main>
    <section id="gallery">
      <h2>Gallery</h2>
      <div class="gallery">
        <img src="https://source.unsplash.com/random/400x300?western" alt="Artwork 1" />
        <img src="https://source.unsplash.com/random/400x300?desert" alt="Artwork 2" />
        <img src="https://source.unsplash.com/random/400x300?cowboy" alt="Artwork 3" />
        <img src="https://source.unsplash.com/random/400x300?cactus" alt="Artwork 4" />
      </div>
    </section>
    <section id="order">
      <h2>Order Now</h2>
      <form name="order" method="POST" data-netlify="true">
        <label for="finish">Finish:</label>
        <select id="finish" name="finish">
          <option value="Metallic">Metallic</option>
          <option value="Acrylic">Acrylic</option>
          <option value="Canvas">Canvas</option>
        </select>
        <label for="size">Size:</label>
        <select id="size" name="size">
          <option value="20x40">20x40&quot;</option>
          <option value="24x36">24x36&quot;</option>
          <option value="20x30">20x30&quot;</option>
          <option value="16x24">16x24&quot;</option>
        </select>
        <p class="price">Price: <span id="price"></span></p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
        <button type="submit">Purchase</button>
      </form>
    </section>
  </main>
  <footer>
    <p>&copy; 2024 Wild West Wall Art</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
