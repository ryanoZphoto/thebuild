<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />

<body class="white-bg">
	<nav class="nav" aria-label="Primary">
		<div class="nav-inner">
			<a class="nav-brand" href="index.html">
				<img src="logo.png" alt="Wild West Wall Art logo" class="logo">
				<span>Wild West Wall Art</span>
			</a>
			<button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle menu">☰</button>
			<ul id="nav-menu" class="nav-links">
				<li><a href="index.html">Home</a></li>
				<li><a href="gallery.html">Gallery</a></li>
				<li><a href="cart.html" aria-current="page">Cart</a></li>
				<li><a href="contact.html">Contact</a></li>
			</ul>
		</div>
	</nav>

	<main style="padding: 1.5rem 1rem;">
		<h1>Checkout</h1>
		<div class="grid-2" style="max-width: 1100px; margin: 0 auto; align-items: start;">
			<section>
				<h2 id="item-title">Selected Item</h2>
				<div id="item-preview" class="preview-container" style="margin-top: .75rem;"></div>
			</section>
			<section>
				<form name="order" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/thankyou.html">
					<input type="hidden" name="form-name" value="order">
					<p style="display:none">
						<label>Don’t fill this out: <input name="bot-field"></label>
					</p>
					<p>
						<label>Name:<br>
							<input type="text" name="name" required>
						</label>
					</p>
					<p>
						<label>Email:<br>
							<input type="email" name="email" required>
						</label>
					</p>
					<p>
						<label>Finish:<br>
							<select name="finish" required>
								<option value="Metallic">Metallic</option>
								<option value="Acrylic">Acrylic</option>
								<option value="Canvas">Canvas</option>
							</select>
						</label>
					</p>
					<p>
						<label>Size:<br>
							<select name="size" required>
								<option value="20x40">20x40"</option>
								<option value="24x36">24x36"</option>
								<option value="20x30">20x30"</option>
								<option value="16x24">16x24"</option>
							</select>
						</label>
					</p>
					<p>
						<label>Quantity:<br>
							<input type="number" name="quantity" value="1" min="1" step="1">
						</label>
					</p>
					<p>
						<label>Message:<br>
							<textarea name="message"></textarea>
						</label>
					</p>

					<fieldset>
						<legend>Shipping Address</legend>
						<p>
							<label>Address Line 1:<br>
								<input type="text" name="address_line_1" required>
							</label>
						</p>
						<p>
							<label>Address Line 2 (optional):<br>
								<input type="text" name="address_line_2">
							</label>
						</p>
						<p>
							<label>City:<br>
								<input type="text" name="city" required>
							</label>
						</p>
						<p>
							<label>State (2-letter):<br>
								<input type="text" name="state" maxlength="2" pattern="[A-Za-z]{2}" required>
							</label>
						</p>
						<p>
							<label>Postal Code:<br>
								<input type="text" name="postal_code" pattern="\d{5}(-\d{4})?" required>
							</label>
						</p>
						<p>
							<label>Country:<br>
								<input type="text" name="country_code" value="US" maxlength="2" pattern="[A-Za-z]{2}" required>
							</label>
						</p>
					</fieldset>

					<p id="total"></p>
					<input type="hidden" name="photo_title">
					<input type="hidden" name="paypal_order_id">
					<input type="hidden" name="paypal_payer_email">
					<div id="paypal-button-container"></div>
				</form>
			</section>
		</div>
	</main>

	<script>
	(function(){
		// Read params
		const params = new URLSearchParams(window.location.search);
		const img = params.get('img') || '';
		const finishParam = (params.get('finish') || 'canvas').toLowerCase();
		const titleParam = params.get('title') || (img ? img.replace(/\.[^.]+$/, '').replace(/[-_]+/g,' ').replace(/\b\w/g, m => m.toUpperCase()) : 'Photo');

		// Seed form
		const form = document.forms.order;
		form.elements.photo_title.value = titleParam;
		const finishMap = { canvas:'Canvas', metal:'Metallic', acrylic:'Acrylic' };
		form.elements.finish.value = finishMap[finishParam] || 'Canvas';

		const prices = {
			Metallic: { "20x40": 220, "24x36": 150, "20x30": 120, "16x24": 70 },
			Acrylic:  { "20x40": 180, "24x36": 130, "20x30": 100, "16x24": 60 },
			Canvas:   { "20x40": 180, "24x36": 130, "20x30": 100, "16x24": 60 }
		};
		const shippingCost = 10;
		const totalDisplay = document.getElementById('total');

		// Rebuild size options to include per-finish price labels
		const sizeSelect = form.elements.size;
		const sizeOrder = ["20x40","24x36","20x30","16x24"];
		function refreshSizeOptions(){
			const finish = form.elements.finish.value;
			const previous = sizeSelect.value;
			sizeSelect.innerHTML = '';
			sizeOrder.forEach(size => {
				if (prices[finish] && prices[finish][size] != null) {
					const opt = document.createElement('option');
					opt.value = size;
					opt.textContent = `${size}\" — $${prices[finish][size].toFixed(2)}`;
					sizeSelect.appendChild(opt);
				}
			});
			if (prices[finish] && prices[finish][previous] != null) {
				sizeSelect.value = previous;
			}
		}

		function updateTotal() {
			const finish = form.elements.finish.value;
			const size = form.elements.size.value;
			const quantity = Math.max(parseInt(form.elements.quantity.value, 10) || 1, 1);
			const itemPrice = prices[finish][size];
			const total = itemPrice * quantity + shippingCost;
			totalDisplay.textContent = `Total: $${total.toFixed(2)} (including $${shippingCost} shipping)`;
			return { finish, size, itemPrice, quantity, total };
		}
		['finish','size','quantity'].forEach(n => form.elements[n].addEventListener('change', updateTotal));
		form.elements.quantity.addEventListener('input', updateTotal);
		refreshSizeOptions();
		updateTotal();

		function val(name) { return form.elements[name]?.value?.trim() || ''; }
		function validateShipping(){
			const req = ['address_line_1','city','state','postal_code','country_code'];
			return req.every(f => val(f));
		}

		// Show preview
		const preview = document.getElementById('item-preview');
		document.getElementById('item-title').textContent = `${titleParam} — ${form.elements.finish.value}`;
		function refreshPreview(){
			preview.innerHTML = '';
			const finish = (form.elements.finish.value || 'Canvas').toLowerCase();
			const baseName = img ? img.replace(/\.[^.]+$/, '') : '';
			const folder = `${finish}_previews`;
			const trySrcs = [
				`${folder}/${baseName}_${finish}.jpg`,
				`gallery_images/${img}`
			];
			const el = document.createElement('img');
			el.alt = `${titleParam} (${finish})`;
			el.loading = 'lazy'; el.decoding = 'async';
			let i = 0;
			function loadNext(){
				if (i >= trySrcs.length) return;
				el.src = trySrcs[i++];
			}
			el.onerror = () => loadNext();
			preview.appendChild(el);
			loadNext();
		}
		refreshPreview();
		form.elements.finish.addEventListener('change', () => {
			document.getElementById('item-title').textContent = `${titleParam} — ${form.elements.finish.value}`;
			refreshSizeOptions();
			refreshPreview();
			updateTotal();
		});

		// Load PayPal SDK and render buttons
		(function loadPayPalSdk(){
			const LIVE_CLIENT_ID = 'AcosS2AbZFUgYmDEx1dh9piJdWL3jM2u0RCRdjf5rJ0YerCZluqwthmTzCzWmov46D39CmL6N8Gysh6a';
			const url = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(LIVE_CLIENT_ID)}&currency=USD&intent=capture&components=buttons&enable-funding=card&commit=true`;
			const s = document.createElement('script');
			s.src = url; s.async = true;
			s.onload = function(){ try { renderPayPalButtons(); } catch(e) { console.error('Render PayPal failed', e); } };
			s.onerror = function(){ console.error('Failed to load PayPal SDK'); alert('Unable to load PayPal. Please refresh or try again later.'); };
			document.head.appendChild(s);
		})();

		function renderPayPalButtons(){
			if (!window.paypal || !window.paypal.Buttons) return;
			window.paypal.Buttons({
				createOrder: function(data, actions){
					if (!validateShipping()) { alert('Please fill in all required shipping address fields.'); throw new Error('Missing shipping fields'); }
					const { finish, size, itemPrice, quantity, total } = updateTotal();
					const address = {
						address_line_1: val('address_line_1'),
						admin_area_2: val('city'),
						admin_area_1: val('state').toUpperCase(),
						postal_code: val('postal_code'),
						country_code: val('country_code').toUpperCase()
					};
					const line2 = val('address_line_2'); if (line2) address.address_line_2 = line2;
					return actions.order.create({
						intent: 'CAPTURE',
						purchase_units: [{
							amount: {
								value: total.toFixed(2),
								currency_code: 'USD',
								breakdown: {
									item_total: { currency_code: 'USD', value: (itemPrice * quantity).toFixed(2) },
									shipping: { currency_code: 'USD', value: (10).toFixed(2) }
								}
							},
							items: [{
								name: `Photo: ${titleParam} — ${finish} ${size}\" Print`,
								unit_amount: { currency_code: 'USD', value: itemPrice.toFixed(2) },
								quantity: quantity.toString()
							}],
							shipping: { name: { full_name: val('name') || 'Customer' }, address }
						}]
					});
				},
				onApprove: function(data, actions){
					return actions.order.capture().then(function(details){
						form.elements.paypal_order_id.value = details?.id || '';
						form.elements.paypal_payer_email.value = details?.payer?.email_address || '';
						form.submit();
					});
				},
				onError: function(err){ console.error('PayPal Buttons error', err); alert('There was a problem processing the payment. Please try again.'); }
			}).render('#paypal-button-container');
		}
	})();
	</script>
	<script>
	// Mobile nav toggle
	(function(){
		const btn = document.querySelector('.nav-toggle');
		const menu = document.getElementById('nav-menu');
		if (btn && menu) {
			btn.addEventListener('click', () => {
				const open = menu.classList.toggle('open');
				btn.setAttribute('aria-expanded', String(open));
			});
		}
	})();
	</script>
</body>
</html>
