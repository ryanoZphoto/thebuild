<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Detail - Wild West Wall Art</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Nav and other shared elements -->

  <section id="photo-detail">
    <h1 id="photo-title"></h1>
    <div class="finish-tabs">
      <button data-finish="canvas">Canvas</button>
      <button data-finish="metal">Metal</button>
      <button data-finish="acrylic">Acrylic</button>
    </div>
    <div class="preview-container">
      <img id="preview-img" src="" alt="Photo Preview">
    </div>
    <a href="#order" data-open-order class="cta">Order This Print</a>
  </section>

  <!-- Existing order modal copied here or linked -->

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const imgFile = urlParams.get('img'); // e.g., 'sedona-moon.jpg'
    const baseName = imgFile.replace(/\.[^.]+$/, ''); // e.g., 'sedona-moon'
    const originalSrc = `gallery_images/${imgFile}`;

    document.getElementById('photo-title').textContent = baseName.replace(/[-_]+/g,' ').replace(/\b\w/g, m => m.toUpperCase());

    const previewImg = document.getElementById('preview-img');
    previewImg.src = originalSrc; // Default to original
    previewImg.alt = 'Photo Preview';

    function loadFinishImage(finish) {
      const finishSrc = `${finish}_previews/${baseName}_${finish}.jpg`;
      previewImg.classList.add('loading'); // Add loading class for animation

      const img = new Image();
      img.src = finishSrc;
      img.onload = () => {
        previewImg.src = finishSrc;
        previewImg.classList.remove('loading', 'error');
      };
      img.onerror = () => {
        previewImg.src = originalSrc; // Fallback
        previewImg.classList.remove('loading');
        previewImg.classList.add('error'); // Style for fallback notice
        console.warn(`Finish image not found: ${finishSrc}. Using original.`);
      };
    }

    document.querySelectorAll('.finish-tabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.finish-tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const finish = btn.dataset.finish;
        loadFinishImage(finish);
      });
    });

    // Set default to canvas
    document.querySelector('[data-finish="canvas"]').click();
  </script>
</body>
</html>
