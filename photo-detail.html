<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Photo Detail</title>
	<link rel="stylesheet" href="styles.css" />
</head>
<body class="white-bg">
	<nav class="nav" aria-label="Primary">
		<div class="nav-inner">
			<a class="nav-brand" href="index.html">
				<img src="logo.png" alt="Wild West Wall Art logo" class="logo">
				<span>Wild West Wall Art</span>
			</a>
			<button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle menu">☰</button>
			<ul id="nav-menu" class="nav-links">
				<li><a href="index.html#gallery">Gallery</a></li>
				<li><a href="cart.html">Cart</a></li>
				<li><a href="mailto:ryan@ryanosmunphoto.com">Contact</a></li>
			</ul>
		</div>
	</nav>

	<main style="padding: 1.5rem 1rem;">
		<h1 id="photo-title">Selected Photo</h1>
		<div class="finish-tabs" role="tablist" aria-label="Finish options">
			<button data-finish="canvas" class="active" role="tab" aria-selected="true">Canvas</button>
			<button data-finish="metal" role="tab" aria-selected="false">Metal</button>
			<button data-finish="acrylic" role="tab" aria-selected="false">Acrylic</button>
		</div>
		<div id="preview-container" class="preview-container" aria-live="polite"></div>
		<a id="order-btn" class="order-cta" href="#">Order This Print</a>
	</main>

	<script>
	(function(){
		const params = new URLSearchParams(window.location.search);
		const img = params.get('img');
		const baseName = img ? img.replace(/\.[^.]+$/, '') : '';
		const titleText = baseName.replace(/[-_]+/g,' ').replace(/\b\w/g, m => m.toUpperCase());
		document.getElementById('photo-title').textContent = titleText || 'Photo';

		const previewContainer = document.getElementById('preview-container');
		const orderBtn = document.getElementById('order-btn');
		let currentFinish = 'canvas';

		function imgExists(src){
			return new Promise(resolve => {
				const i = new Image();
				i.onload = () => resolve(src);
				i.onerror = () => resolve(null);
				i.src = src;
			});
		}

		async function loadFinishVariants(finish){
			currentFinish = finish;
			previewContainer.innerHTML = '';
			if (!baseName) return;

			const folder = `${finish}_previews`;
			const candidates = [];
			candidates.push(`${folder}/${baseName}_${finish}.jpg`);
			for (let n=1; n<=10; n++) {
				candidates.push(`${folder}/${baseName}_${finish}${n}.jpg`);
			}
			candidates.push(`${folder}/${baseName}_${finish}_variant.jpg`);

			const checks = await Promise.all(candidates.map(imgExists));
			const valid = checks.filter(Boolean);

			if (valid.length === 0) {
				const fallback = `gallery_images/${img}`;
				const el = document.createElement('img');
				el.src = fallback;
				el.alt = `${titleText} (${finish})`;
				el.loading = 'lazy';
				el.decoding = 'async';
				previewContainer.style.gridTemplateColumns = 'repeat(auto-fit, minmax(300px, 1fr))';
				previewContainer.appendChild(el);
				return;
			}

			const colMin = valid.length >= 3 ? 300 : (valid.length === 2 ? 350 : 480);
			previewContainer.style.gridTemplateColumns = `repeat(auto-fit, minmax(${colMin}px, 1fr))`;
			valid.forEach(src => {
				const el = document.createElement('img');
				el.src = src;
				el.alt = `${titleText} (${finish})`;
				el.loading = 'lazy';
				el.decoding = 'async';
				previewContainer.appendChild(el);
			});
		}

		// Tab wiring
		document.querySelectorAll('.finish-tabs button').forEach(btn => {
			btn.addEventListener('click', () => {
				document.querySelectorAll('.finish-tabs button').forEach(b => b.classList.remove('active'));
				btn.classList.add('active');
				loadFinishVariants(btn.getAttribute('data-finish'));
			});
		});

		// Order button routes to cart with params
		orderBtn.addEventListener('click', (e) => {
			e.preventDefault();
			const url = new URL('cart.html', window.location.origin);
			url.searchParams.set('img', img || '');
			url.searchParams.set('finish', currentFinish);
			url.searchParams.set('title', titleText);
			window.location.href = url.pathname + url.search;
		});

		// initial load
		loadFinishVariants('canvas');
	})();
	</script>
	<script>
	// Mobile nav toggle
	(function(){
		const btn = document.querySelector('.nav-toggle');
		const menu = document.getElementById('nav-menu');
		if (btn && menu) {
			btn.addEventListener('click', () => {
				const open = menu.classList.toggle('open');
				btn.setAttribute('aria-expanded', String(open));
			});
		}
	})();
	</script>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Detail - Wild West Wall Art</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="white-bg">

  <!-- Nav and other shared elements -->

  <section id="photo-detail">
    <h1 id="photo-title"></h1>
    <div class="finish-tabs">
      <button data-finish="canvas">Canvas</button>
      <button data-finish="metal">Metal</button>
      <button data-finish="acrylic">Acrylic</button>
    </div>
    <div class="preview-container">
      <img id="preview-img" src="" alt="Photo Preview">
    </div>
<a href="#order" data-open-order class="order-cta">Order This Print</a>
  </section>

  <!-- Existing order modal copied here or linked -->

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const imgFile = urlParams.get('img'); // e.g., 'sedona-moon.jpg'
    const baseName = imgFile.replace(/\.[^.]+$/, ''); // e.g., 'sedona-moon'
    const originalSrc = `gallery_images/${imgFile}`;

    document.getElementById('photo-title').textContent = baseName.replace(/[-_]+/g,' ').replace(/\b\w/g, m => m.toUpperCase());

    const previewImg = document.getElementById('preview-img');
    previewImg.src = originalSrc; // Default to original
    previewImg.alt = 'Photo Preview';

    // Replace the loadFinishVariants function with Promise-based version
    function loadFinishVariants(finish) {
      const previewContainer = document.querySelector('.preview-container');
      previewContainer.innerHTML = ''; // Clear previous
      previewContainer.classList.add('loading');

      const variantPromises = [];
      for (let i = 0; i <= 10; i++) { // Check base and up to 10 variants
        const suffix = i > 0 ? i : '';
        const variantSrc = `${finish}_previews/${baseName}_${finish}${suffix}.jpg`;
        variantPromises.push(
          new Promise(resolve => {
            const img = new Image();
            img.src = variantSrc;
            img.onload = () => resolve(variantSrc);
            img.onerror = () => resolve(null);
          })
        );
      }

      Promise.all(variantPromises).then(results => {
        const variants = results.filter(src => src !== null);
        previewContainer.classList.remove('loading');

        if (variants.length === 0) {
          const img = document.createElement('img');
          img.src = originalSrc;
          img.alt = 'Fallback Preview';
          img.classList.add('error');
          previewContainer.appendChild(img);
          return;
        }

        // Dynamic grid sizing
        previewContainer.style.gridTemplateColumns = `repeat(${variants.length}, 1fr)`;
        variants.forEach(src => {
          const img = document.createElement('img');
          img.src = src;
          img.alt = `${finish} Variant`;
          previewContainer.appendChild(img);
        });

        // If many (>3), add cycling button (optional; can expand if needed)
        if (variants.length > 3) {
          const nextBtn = document.createElement('button');
          nextBtn.textContent = 'Next Variant';
          nextBtn.onclick = () => { /* Add cycle logic here if desired */ };
          previewContainer.appendChild(nextBtn);
        }
      });
    }

    document.querySelectorAll('.finish-tabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.finish-tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const finish = btn.dataset.finish;
        loadFinishVariants(finish);
      });
    });

    // Set default to canvas
    document.querySelector('[data-finish="canvas"]').click();
  </script>
</body>
</html>
